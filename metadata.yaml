# This file is still required due to data-platform-workflows not supporting unified
# charmcraft.yaml syntax. Details see:
# https://github.com/canonical/data-platform-workflows/issues/169
name: charmed-etcd
title: Charmed etcd VM operator
summary: Operator for etcd databases in VM environments.
description: |
  Etcd is a distributed, reliable key-value store for the most critical data of
  distributed systems, such as Kubernetes. This charmed operator deploys and operates
  etcd on virtual machines.

  To learn more about its deployment and operation, see the 
  [official Charmed etcd documentation](https://canonical-charmed-etcd.readthedocs-hosted.com/).

peers:
  etcd-peers:
    interface: etcd_peers
  restart:
    interface: rolling_op
  status-peers:
    interface: status_peers

provides:
  etcd-client:
    interface: etcd_client
  cos-agent:
    interface: cos_agent

requires:
  peer-certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  client-certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  client-cas:
    interface: certificate_transfer
    limit: 1
    optional: true
  s3-credentials:
    interface: s3
    limit: 1
    optional: true
  azure-credentials:
    interface: azure
    limit: 1
    optional: true

storage:
  data:
    type: filesystem
    location: /var/snap/charmed-etcd/common/var/lib/etcd
    description: storage for etcd data
    minimum-size: 1G
  logs:
    type: filesystem
    location: /var/snap/charmed-etcd/common/var/log/etcd
    description: storage for logfiles of etcd server
    minimum-size: 1G
  archive:
    type: filesystem
    location: /var/snap/charmed-etcd/common/archive
    description: storage for local backup files during transfer to/from remote object storage
