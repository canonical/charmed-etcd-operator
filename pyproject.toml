[tool.poetry]
package-mode = false
requires-poetry = ">=2.0.0"

[tool.poetry.dependencies]
python = "^3.12"
ops = "^3.1.0"
tenacity = "*"
boto3 = "^1.40.11"
mypy-boto3-s3 = "^1.40.0"
azure-storage-blob = "^12.25.1"
azure-core = "^1.33.0"
validators = ">=0.35.0"
data-platform-helpers = ">=0.1.7"
charm-refresh = "^3.1.0.0"
toml = "^0.10.2"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.charm-libs.dependencies]
# data_platform_libs/v0/data_interfaces.py
ops = ">=2.0.0"
# data_platform_libs/v0/upgrade.py
poetry-core = "*"
# tls_certificates_interface/v4/tls_certificates.py
cryptography = "==44.0.2"
pydantic = ">= 1.0"
cosl = ">= 0.0.50"

[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
ruff = "*"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "*"
codespell = "*"
shellcheck-py = "*"

[tool.poetry.group.unit.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-mock = "*"
coverage = { extras = ["toml"], version = "*" }
parameterized = "*"
ops-scenario = "*"
ops = "^3.1.0"

[tool.poetry.group.integration.dependencies]
ops = "^3.1.0"
pytest = "*"
pytest-asyncio = "*"
pytest-operator = "^0.43.1"
juju = "==3.6.0"
allure-pytest = "*"
allure-pytest-default-results = "^0.1.2"
tenacity = "*"
pydantic = ">= 1.0"
boto3 = "^1.40.11"
mypy-boto3-s3 = "^1.40.0"
data-platform-helpers = ">=0.1.7"
toml = "^0.10.2"

[tool.poetry.group.build-refresh-version]
optional = true

[tool.poetry.group.build-refresh-version.dependencies]
charm-refresh-build-version = "^0.2.0"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Linting tools configuration
[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.extend-ignore = [
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
lint.ignore = ["E501", "D107"]
extend-exclude = ["__pycache__", "*.egg_info"]
lint.per-file-ignores = { "tests/*" = ["D100", "D101", "D102", "D103", "D104"] }
exclude = ["tests/integration/client_relations/requirer-charm/lib"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage"

[tool.pyright]
include = ["src/**/*.py", "lib/**/*.py"]
