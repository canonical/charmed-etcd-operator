create-backup:
  description: Create a database backup and send it to an object storage.
    S3 credentials are retrieved from a relation with the S3 integrator charm.

list-backups:
  description: List database backups. 
    S3 credentials are retrieved from a relation with the S3 integrator charm.

restore:
  description: Restore a database backup from object storage.
    S3 credentials are retrieved from a relation with the S3 integrator charm.
  params:
    backup-id:
      type: string
      description: A backup-id to identify the backup to restore. Format of <%Y-%m-%dT%H:%M:%SZ>