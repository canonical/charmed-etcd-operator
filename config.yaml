options:
  system-users:
    type: secret
    description: |
      Configure the internal system user and it's password. The password will
      be auto-generated if this option is not set. It is for internal use only
      and SHOULD NOT be used by applications. This needs to be a Juju Secret URI pointing
      to a secret that contains the following content: `root: <password>`.
  
  tls-peer-private-key:
    type: secret
    description: |
      A Juju secret URI of a secret containing the private key for peer-to-peer TLS certificates.
  
  tls-client-private-key:
    type: secret
    description: |
      A Juju secret URI of a secret containing the private key for client-to-server TLS certificates.
  
  election-timeout:
    type: int
    default: 1000
    description: How long, in milliseconds, a follower node will go without hearing a heartbeat before attempting to become leader itself.
      The value should be at least 10x the value of <heartbeat-interval>, and must not exceed 50000.

  heartbeat-interval:
    type: int
    default: 100
    description: The frequency, in milliseconds, with which the leader will notify followers that it is still the leader. 
      For best practices, the parameter should be set around round-trip time between members.
      The value must be between 10 and 5000 at most.

  certificate-extra-sans:
    type: string
    description: |
      Config options to add extra-sans to the ones used when requesting server certificates.
      The extra-sans are specified by comma-separated names to be added when requesting signed certificates.
      Use "{unit}" as a placeholder to be filled with the unit number, e.g. "worker-{unit}" will be translated as 
      "worker-0" for unit 0 and "worker-1" for unit 1 when requesting the certificate.

  client-certificate-domain:
    type: string
    description: |
      Config option to specify a domain to be added to the common names in certificate signing requests
      for client certificates. Example: "mydomain.com". This must match the allowed domains from the TLS provider.
      In the case of Vault, this should be set to one of the domains configured in "pki_allowed_domains". 

  client-certificate-include-ip-sans:
    type: boolean
    default: true
    description: |
      Config option to enable or disable IP addresses in the subject alternative names (SAN) used for 
      certificate signing requests for client certificates. This should be set to false if the related 
      TLS provider does not support IP addresses in certificates.

  peer-certificate-domain:
    type: string
    description: |
      Config option to specify a domain to be added to the common names in certificate signing requests 
      for peer server certificates. Example: "mydomain.com". This must match the allowed domains from the TLS 
      provider. In the case of Vault, this should be set to one of the domains configured in "pki_allowed_domains". 

  pause-after-unit-refresh:
    type: string
    default: first
    description: |
      Wait for manual confirmation to resume refresh after these units refresh

      Allowed values: "all", "first", "none"
